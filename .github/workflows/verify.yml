name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the verification tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git glib2 nodejs zip
      - name: Run verification
        run: ./test.sh
