name: Wetterkurve
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: F3273K985F
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Wetterkurve:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wean.wetterkurve
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Wetterkurve.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: WetterkurveWidgets
        embed: true
  WetterkurveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wean.wetterkurve.widgets
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/WetterkurveWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  WetterkurveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Wetterkurve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wean.wetterkurve.tests
        GENERATE_INFOPLIST_FILE: YES
  WetterkurveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Wetterkurve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wean.wetterkurve.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Wetterkurve:
    build:
      targets:
        Wetterkurve: all
        WetterkurveWidgets: all
        WetterkurveTests: [test]
    test:
      targets:
        - WetterkurveTests
        - WetterkurveUITests
